<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>法规详情 · 发补智能体原型 v18</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar" id="topbar"></header>
  <aside class="side" id="side"></aside>

  <main class="content">
    <div class="page-head">
      <div>
        <div class="page-title"><span class="dot"></span>法规详情</div>
        <div class="page-sub" id="pageSub">规则「依据」对应的法规条款原文，以及引用该条款的规则</div>
      </div>
      <div class="right">
        <a class="btn" id="backLink" href="./05-规则校验.html">返回规则校验</a>
      </div>
    </div>

    <div class="lawwrap" id="lawWrap">
      <div class="lawtoc" id="toc"></div>
      <div id="lawBox"></div>
    </div>
  </main>
</div>

<div id="toastBox"></div>

<script src="./assets/app.js"></script>
<script src="./assets/data.js"></script>
<script>
(function () {
  'use strict';
  var $ = APP.$, $$ = APP.$$, esc = APP.esc, ic = APP.ic;

  var qs = new URLSearchParams(location.search);
  var lawId = qs.get('law');
  var artNo = qs.get('art');
  var from = qs.get('from');
  var caseNo = qs.get('case') || 'CQX2600312';

  APP.renderTop({ crumb: ['审评工作台', '发补智能体', '法规详情'] });
  APP.renderSide('rules');

  var back = './05-规则校验.html?case=' + encodeURIComponent(caseNo) + (from ? '&rid=' + encodeURIComponent(from) : '');
  $('#backLink').href = back;

  var LAW = (DATA.LAWS || []).filter(function (l) { return l.id === lawId; })[0];

  function rulesByArt(law, no) {
    return (DATA.RULES || []).filter(function (r) {
      return (r.citations || []).some(function (c) { return c[0] === law.id && c[1] === no; });
    });
  }

  function renderList() {
    document.title = '法规与指导原则库 · 发补智能体原型 v18';
    $('#pageSub').textContent = '共 ' + DATA.LAWS.length + ' 部法规 / 指导原则 / 标准，点击查看条款原文';
    $('#toc').innerHTML = '<h4>法规目录</h4>' +
      DATA.LAWS.map(function (l) {
        return '<a href="./06-法规详情.html?law=' + l.id + (from ? '&from=' + encodeURIComponent(from) : '') +
          '&case=' + encodeURIComponent(caseNo) + '">' + esc(shortTitle(l.title)) + '</a>';
      }).join('') +
      '<div class="side-tip" style="margin-top:9px">条款正文为演示节选，正式环境应接入法规知识库全文。</div>';

    $('#lawBox').innerHTML =
      '<div class="lawcard"><h1>法规与指导原则库</h1>' +
        '<div class="lawsum">规则里的「依据」都会指向这里的某个条款。点击任意一部法规，可以查看条款正文、施行信息，以及引用该条款的规则清单。</div></div>' +
      '<div class="lawlist">' + DATA.LAWS.map(function (l) {
        return '<div class="lawitem"><h4>' + esc(l.title) + '</h4>' +
          '<div class="m">' + esc(l.type) + ' · ' + esc(l.code) + ' · 施行 ' + esc(l.effective) + '</div>' +
          '<div class="s">' + esc(l.summary) + '</div>' +
          '<div style="margin-top:9px"><a class="btn sm" href="./06-法规详情.html?law=' + l.id +
            '&case=' + encodeURIComponent(caseNo) + '">查看 ' + l.articles.length + ' 条条款</a></div></div>';
      }).join('') + '</div>';
  }
  function shortTitle(t) { return t.length > 24 ? t.slice(0, 24) + '…' : t; }

  function renderLaw() {
    document.title = LAW.title + ' · 法规详情';
    $('#pageSub').innerHTML = '规则「依据」指向的法规条款原文 · ' + esc(LAW.type);

    $('#toc').innerHTML = '<h4>' + esc(shortTitle(LAW.title)) + '</h4>' +
      LAW.articles.map(function (a, i) {
        return '<a data-jump="' + i + '" class="' + (a.no === artNo ? 'on' : '') + '">' + esc(a.no) + '</a>';
      }).join('') +
      '<div style="border-top:1px solid var(--bd2);margin:8px 0 6px"></div>' +
      '<a href="./06-法规详情.html?case=' + encodeURIComponent(caseNo) + '">← 返回法规目录</a>' +
      '<div class="side-tip" style="margin-top:9px">条款正文为演示节选，正式环境应接入法规知识库全文。</div>';

    var articles = LAW.articles.map(function (a, i) {
      var rs = rulesByArt(LAW, a.no);
      var on = a.no === artNo;
      return '<div class="art' + (on ? ' on' : '') + '" id="art-' + i + '">' +
        '<div class="art-h"><span class="art-no">' + esc(a.no) + '</span>' +
          (on ? '<span class="tag t-blue">当前依据</span>' : '') + '</div>' +
        '<div class="art-b">' + esc(a.text) + '</div>' +
        '<div class="lawrules"><div class="t">引用本条款的规则（' + rs.length + '）</div>' +
          (rs.length ? rs.map(function (r) {
            return '<a href="./05-规则校验.html?case=' + encodeURIComponent(caseNo) + '&rid=' + encodeURIComponent(r.id) + '">' +
              ic('cpu', 11) + esc(r.id) + ' ' + esc(r.name) +
              (r.id === from ? '<span class="tag t-green tiny" style="margin-left:3px">当前规则</span>' : '') + '</a>';
          }).join('') : '<span style="font-size:12px;color:var(--t4)">暂无规则引用本条款</span>') +
        '</div></div>';
    }).join('');

    $('#lawBox').innerHTML =
      '<div class="lawcard">' +
        '<h1>' + esc(LAW.title) + '</h1>' +
        '<div class="lawmeta">' +
          '<span class="tag t-blue">' + esc(LAW.type) + '</span>' +
          '<span class="tag t-gray">' + esc(LAW.code) + '</span>' +
          '<span class="tag t-gray">' + esc(LAW.issuer) + '</span>' +
          '<span class="tag t-gray">施行 ' + esc(LAW.effective) + '</span>' +
        '</div>' +
        '<div class="lawsum">' + esc(LAW.summary) + '</div>' +
      '</div>' +
      '<div class="lawcard" style="padding-top:14px">' +
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">' +
          '<span style="font-size:13.5px;font-weight:600">条款正文</span>' +
          '<span class="tag t-gray">共 ' + LAW.articles.length + ' 条 · 演示节选</span></div>' +
        articles +
      '</div>';

    setTimeout(function () {
      var el = $('.art.on');
      if (el) {
        var top = el.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    }, 60);
  }

  document.addEventListener('click', function (e) {
    var j = e.target.closest('[data-jump]');
    if (!j) return;
    var i = parseInt(j.dataset.jump, 10);
    var el = document.getElementById('art-' + i);
    if (!el) return;
    $$('#toc a[data-jump]').forEach(function (x) { x.classList.toggle('on', +x.dataset.jump === i); });
    $$('.art').forEach(function (x) { x.classList.remove('on'); });
    el.classList.add('on');
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  });

  if (LAW) renderLaw(); else renderList();
})();
</script>
</body>
</html>
