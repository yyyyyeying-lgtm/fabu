<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发补规则校验 · 发补智能体原型 v22</title>
<link rel="stylesheet" href="./assets/style.css">
</head>
<body class="fit pg-flow">
<div class="shell">
  <header class="topbar" id="topbar"></header>
  <aside class="side" id="side"></aside>

  <main class="content">
    <div class="page-head">
      <div>
        <div class="page-title"><span class="dot"></span>发补规则校验</div>
        <div class="page-sub">规则列表 → 规则结果 → 企业申报材料原文；三个模块可分别「一键弹出」，方便左右分屏复核</div>
      </div>
      <div class="right">
        <button class="btn popback" id="popBack" title="把所有已弹出的模块收回原位">收回浮窗</button>
        <a class="btn" href="./01-任务列表.html">返回任务列表</a>
        <button class="btn" id="btnMap">文件归属调整</button>
        <button class="btn primary" id="btnDraft">生成发补意见草稿</button>
      </div>
    </div>

    <div class="casebar" id="casebar"></div>
    <div class="rulebar" id="rulebar"></div>

    <div class="rulewrap" style="--rh:max(520px,calc(100vh - 302px))">
      <div class="wbc" id="ruleListCard">
        <div class="wbc-hd"><h4>规则列表</h4><span class="sub" id="listSub"></span>
          <div class="right"><button class="btn xs" data-pop="rules">一键弹出</button></div></div>
        <div class="wbc-bd" id="listBody"></div>
      </div>
      <div class="rcol" id="rcol">
        <div class="wbc" id="ruleResultCard">
          <div class="wbc-hd"><h4>规则结果</h4><span class="sub" id="resSub"></span>
            <div class="right"><button class="btn xs" data-pop="result">一键弹出</button></div></div>
          <div class="wbc-bd" id="resultBody"></div>
        </div>
        <div class="wbc" id="ruleBasisCard">
          <div class="wbc-hd"><h4>依据</h4><span class="sub" id="basisSub"></span>
            <div class="right">
                <button class="btn xs" id="basisMore" title="在本页弹层里查看本卷命中的全部法规（不跳页）">查看更多</button>
            </div></div>
          <div class="wbc-bd basis-bd" id="basisBody"></div>
        </div>
      </div>
      <div class="wbc" id="rulePdfCard">
        <div class="wbc-hd"><h4>企业申报材料</h4><span class="sub">原文 PDF</span>
          <div class="right"><button class="btn xs" data-pop="pdf">一键弹出</button></div></div>
        <div class="wbc-bd" id="pdfBody" style="padding:0;overflow:hidden"></div>
      </div>
    </div>
  </main>
</div>

<div id="toastBox"></div>

<script src="./assets/app.js"></script>
<script src="./assets/data.js"></script>
<script>
(function () {
  'use strict';
  var $ = APP.$, $$ = APP.$$, esc = APP.esc, ic = APP.ic;

  var qs = new URLSearchParams(location.search);
  var caseNo = qs.get('case') || 'CQX2600312';
  var CASE = DATA.CASES.filter(function (c) { return c.acceptNo === caseNo; })[0] || DATA.CASES[0];

  var ST = {
    status: 'all', kw: '', active: null,
    rules: JSON.parse(JSON.stringify(DATA.RULES || [])),
    docs: JSON.parse(JSON.stringify(DATA.DOCS || [])),
    pdf: null, pdfPage: 0, zoom: 1, editing: null,
    mapDir: 'rps9', mapKw: '', na: {}, modal: null
  };

  /* ===================== 系统操作留痕 ===================== */
  var ME = '叶颖';
  function nowFull() {
    var d = new Date();
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function logRule(r, act, detail, tone) {
    if (!r) return;
    r.log = r.log || [];
    r.log.unshift({ who: ME, at: nowFull(), act: act, detail: detail || '', tone: tone || '' });
    if (r.log.length > 30) r.log.length = 30;
  }
  /* v22：一行一条 —— 谁 · 时间 · 做了什么；detail 只写「改了什么对象」，不再贴原文对比 */
  function auditRowHtml(x) {
    return '<li class="au-row' + (x.tone ? ' ' + x.tone : '') + '" title="' +
        esc(x.who + ' · ' + x.at + ' · ' + (x.act || '') + (x.detail ? ' · ' + x.detail : '')) + '">' +
      '<span class="au-av">' + esc(String(x.who).slice(0, 1)) + '</span>' +
      '<div class="au-bd">' +
        '<b class="au-who">' + esc(x.who) + '</b>' +
        '<em class="au-tm">' + esc(x.at) + '</em>' +
        '<span class="au-act">' + esc(x.act) + '</span>' +
        (x.detail ? '<span class="au-dt">' + esc(x.detail) + '</span>' : '') +
      '</div></li>';
  }
  function auditHtml(r) {
    var list = r.log || [];
    var h = '<div class="audit">' +
      '<div class="audit-h">' + ic('clock', 13) + '<b>操作留痕</b>' +
        '<span class="cnt">' + list.length + ' 条</span>' +
        '<span class="sp"></span>' +
        '<span class="hint">谁 · 什么时间 · 做了什么</span>' +
      '</div>';
    if (!list.length) {
      h += '<div class="audit-empty">该规则暂无操作记录；采纳、修改 AI 结论、填写备注都会在这里留痕。</div>';
    } else {
      h += '<ul class="audit-list">' + list.map(auditRowHtml).join('') + '</ul>';
    }
    return h + '</div>';
  }
  /* 演示用的历史留痕：让「谁改了什么」一眼可见 */
  function seedLogs() {
    var seeds = {
      'REG-说明书-004': [
        { who: '张明', at: '10-25 14:32', act: '采纳结论', detail: '采纳人工修改后的版本，已写入草稿' },
        { who: '李静', at: '10-25 14:18', act: '修改 AI 结论', detail: '改为「补充适用人群、使用环境及操作人员资质」' }
      ],
      'REG-技术要求-009': [
        { who: '王建华', at: '10-25 10:06', act: '标记不采纳', detail: '备注：企业已在 3.2 节提供方法学验证' }
      ]
    };
    ST.rules.forEach(function (r) {
      if (r.log && r.log.length) return;
      var sd = seeds[r.id];
      if (sd) r.log = sd.slice();
      else if (r.status === '已采纳') r.log = [{ who: '叶颖', at: r.at || '10-25 09:40', act: '采纳结论', detail: '采纳 AI 原始结论，已写入发补意见草稿' }];
    });
  }

  function nowStr() {
    var d = new Date();
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function short(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
  function current() {
    return ST.rules.filter(function (r) { return r.id === ST.active; })[0] || null;
  }
  function stat() {
    var r = ST.rules;
    return {
      total: r.length,
      wait: r.filter(function (x) { return x.status === '待复核'; }).length,
      adopted: r.filter(function (x) { return x.status === '已采纳'; }).length,
      ignored: r.filter(function (x) { return x.status === '不采纳'; }).length
    };
  }
  /* 单条规则的历史人工采纳率 */
  function rateText(r) {
    var hr = r.hr || { a: 0, n: 0 };
    if (!hr.n) return '—';
    return Math.round(hr.a / hr.n * 100) + '%';
  }

  /* ---------------- 顶部 ---------------- */
  APP.renderTop({ crumb: ['审评工作台', '发补智能体', '规则校验'] });
  APP.renderSide('rules');

  $('#casebar').innerHTML =
    '<div class="cb-main">' +
      '<div class="cb-name">' + esc(CASE.product) +
        '<span class="badge ' + ((DATA.STATUS[CASE.status] || {}).tone || 'b-gray') + '"><span class="bd"></span>' + esc(CASE.status) + '</span>' +
        '<span class="pid">' + esc(CASE.acceptNo) + '</span></div>' +
      '<div class="cb-meta">' +
        '<span>申请人 <b>' + esc(CASE.ent) + '</b></span>' +
        '<span>器械品类 <b>' + esc((CASE.devCat || []).slice(1, 3).join(' › ') || CASE.cat) + '</b></span>' +
        '<span>申请类型 <b>' + esc(CASE.applyType || '-') + '</b></span>' +
        '<span>申请事项 <b>' + esc(CASE.applyItem || '-') + '</b></span>' +
      '</div>' +
    '</div>' +
    '<div class="cb-right">' +
      '<span class="tag t-gray">规则包 2026-Q3</span>' +
      '<span class="tag t-gray">运行于 ' + esc((CASE.flow && CASE.flow.rule && CASE.flow.rule.at) || '—') + '</span>' +
    '</div>';

  /* ---------------- 规则执行进度（条数多，需要看到跑到第几条） ---------------- */
  var EG = { timer: null, running: false, pct: 0, cnt: 0, ms: 0, k: 0 };
  function fmtMs(ms) {
    var s2 = ms / 1000, mm = Math.floor(s2 / 60), ss = s2 - mm * 60;
    return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss.toFixed(1);
  }
  function setSeen(k) {
    $$('#rlist .rl-item').forEach(function (it, i) { it.classList.toggle('seen', i < k); });
  }
  function emHtml() {
    var n = ST.rules.length || 13;
    return '<div class="engmin' + (EG.running ? ' running' : (EG.ms ? ' done' : '')) + '" id="engMin"' +
      ' title="规则引擎执行进度：已校验条数 / 总条数 · 耗时">' +
      '<span class="em-dot"></span>' +
      '<span class="em-t" id="emState">' + (EG.running ? '校验中' : (EG.ms ? '校验完成' : '待运行')) + '</span>' +
      '<span class="em-bar"><i id="emBar" style="width:' + Math.round(EG.pct) + '%"></i></span>' +
      '<span class="em-n"><b id="emCnt">' + EG.cnt + '</b><em>/' + n + '</em></span>' +
      '<span class="em-tm" id="emTime">' + fmtMs(EG.ms) + '</span>' +
    '</div>';
  }
  function paintEngine() {
    var box = $('#engMin'); if (!box) return;
    box.classList.toggle('running', !!EG.running);
    box.classList.toggle('done', !EG.running && EG.ms > 0);
    var st = $('#emState'); if (st) st.textContent = EG.running ? '校验中' : (EG.ms ? '校验完成' : '待运行');
    var bar = $('#emBar'); if (bar) bar.style.width = Math.round(EG.pct) + '%';
    var c = $('#emCnt'); if (c) c.textContent = EG.cnt;
    var t = $('#emTime'); if (t) t.textContent = fmtMs(EG.ms);
  }
  function runEngine(silent) {
    var n = ST.rules.length || 13;
    var D = Math.max(1800, n * 220);
    var t0 = Date.now();
    EG.running = true; EG.pct = 0; EG.cnt = 0; EG.ms = 0; EG.k = 0;
    var card = $('#ruleListCard'); if (card) card.classList.add('scanning');
    setSeen(0);
    renderStats();
    paintEngine();
    if (!silent) APP.toast('规则引擎已重新启动，正在逐条校验申报材料…', 'info', 2200);
    clearInterval(EG.timer);
    EG.timer = setInterval(function () {
      var el = Date.now() - t0;
      var p = Math.min(1, el / D);
      EG.ms = el; EG.pct = p * 100;
      var k = Math.min(n, Math.floor(p * n) + 1);
      if (k !== EG.k) { EG.k = k; EG.cnt = k; setSeen(k); }
      paintEngine();
      if (p >= 1) { clearInterval(EG.timer); finishEngine(Date.now() - t0); }
    }, 60);
  }
  function finishEngine(cost) {
    EG.running = false; EG.ms = cost; EG.pct = 100; EG.cnt = ST.rules.length;
    paintEngine();
    var card = $('#ruleListCard'); if (card) card.classList.remove('scanning');
    setSeen(EG.cnt);
    var rw = $('#resultBody .reswrap');
    if (rw) { rw.classList.remove('fadeup'); void rw.offsetWidth; rw.classList.add('fadeup'); }
  }

  function renderStats() {
    var s = stat();
    var box = $('#rulebar');
    if (!box) return;
    var done = s.adopted + s.ignored;
    box.innerHTML =
      '<div class="rsum">规则 <b>' + s.total + '</b></div>' +
      '<div class="rsum wait">待复核 <b>' + s.wait + '</b></div>' +
      '<div class="rsum ok">已采纳 <b>' + s.adopted + '</b></div>' +
      '<div class="rsum">不采纳 <b>' + s.ignored + '</b></div>' +
      '<div class="rsum">复核进度 <b>' + done + '<small style="font-size:11px;color:var(--t3)"> / ' + s.total + '</small></b></div>' +
      '<div class="right">' +
        emHtml() +
        '<button class="btn sm" data-bar="export">导出台账</button>' +
        '<button class="btn sm" data-bar="rerun">重新运行规则</button>' +
      '</div>';
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ __fb: 'ruleState', stats: {
        wait: s.wait, adopted: s.adopted, ignored: s.ignored
      } }, '*');
    }
  }

  /* ---------------- 规则列表 ---------------- */
  function filteredRules() {
    var kw = ST.kw.trim().toLowerCase();
    return ST.rules.filter(function (r) {
      if (ST.status !== 'all' && r.status !== ST.status) return false;
      if (kw) {
        var hay = (r.id + r.name + r.check + r.ai).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function levelTag(l) {
    var cls = l === '高' ? 't-red' : l === '中' ? 't-amber' : 't-gray';
    return '<span class="tag tiny ' + cls + '">' + l + '</span>';
  }
  function levelTagFull(l) {
    var cls = l === '高' ? 't-red' : l === '中' ? 't-amber' : 't-gray';
    return '<span class="tag tiny ' + cls + '">' + l + '风险</span>';
  }
  function statusTag(s) {
    var cls = s === '待复核' ? 'b-amber' : s === '已采纳' ? 'b-green' : 'b-gray';
    return '<span class="badge ' + cls + '" style="font-size:11px;padding:0 6px;line-height:16px"><span class="bd"></span>' + s + '</span>';
  }

  function mountList() {
    var box = $('#listBody');
    if (!box) return;
    box.innerHTML = '<div class="rfilter" id="rfilter"></div><div class="rlist" id="rlist"></div>';
    renderFilter();
    renderListItems();
  }

  function renderFilter() {
    var box = $('#rfilter');
    if (!box) return;
    var s = stat();
    var counts = {
      all: ST.rules.length,
      '待复核': s.wait, '已采纳': s.adopted, '不采纳': s.ignored
    };
    var chips = [['all', '全部', counts.all], ['待复核', '待复核', counts['待复核']],
      ['已采纳', '已采纳', counts['已采纳']], ['不采纳', '不采纳', counts['不采纳']]];
    box.innerHTML = '<div class="fsearch"><input id="rKw" placeholder="搜索规则名称 / 检查项" value="' + esc(ST.kw) + '"></div>' +
      chips.map(function (c) {
        return '<span class="rfchip' + (ST.status === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + c[1] + '<b>' + c[2] + '</b></span>';
      }).join('');
  }

  function listItem(r) {
    return '<div class="rl-item' + (r.id === ST.active ? ' on' : '') + '" data-act="select" data-id="' + esc(r.id) + '">' +
      '<div class="rl-top"><span class="rl-id">' + esc(r.id) + '</span></div>' +
      '<div class="rl-name">' + esc(r.name) + '</div>' +
      '<div class="rl-meta">' + levelTag(r.level) + statusTag(r.status) +
        '<span class="rl-rate" title="人工采纳率：近 ' + (r.hr ? r.hr.n : 0) + ' 次命中中 ' +
          (r.hr ? r.hr.a : 0) + ' 次被人工采纳">人工采纳率 <b>' + rateText(r) + '</b></span></div>' +
      '<div class="rl-snip">' + esc(r.ai) + '</div></div>';
  }

  function renderListItems() {
    var box = $('#rlist');
    var list = filteredRules();
    if ($('#listSub')) $('#listSub').textContent = list.length + ' / ' + ST.rules.length + ' 条';
    if (!box) return;
    box.innerHTML = list.length
      ? list.map(listItem).join('')
      : '<div class="empty" style="padding:36px 10px"><div class="eic">' + ic('search', 20) + '</div>' +
        '<div class="et">没有符合条件的规则</div><div class="es">试试切换状态或清空搜索词</div></div>';
  }

  /* ---------------- 规则结果 ---------------- */
  function citationsHtml(r) {
    if (!r.citations || !r.citations.length) return esc(r.basis || '—');
    /* v10：每条依据都渲染成独立可点的行，支持一条规则挂多条依据 */
    return '<div class="basislinks">' + r.citations.map(function (c, i) {
      var law = DATA.LAWS.filter(function (l) { return l.id === c[0]; })[0];
      if (!law) return '<span class="basisrow plain">' + esc(c[0] + ' ' + c[1]) + '</span>';
      var href = './06-法规详情.html?law=' + encodeURIComponent(law.id) +
        '&art=' + encodeURIComponent(c[1]) + '&from=' + encodeURIComponent(r.id) +
        '&case=' + encodeURIComponent(CASE.acceptNo);
      return '<a class="basisrow lawlink" href="' + href + '" target="_blank" title="查看《' +
          esc(law.title) + '》' + esc(c[1]) + ' 的条款详情">' +
        '<span class="bno">' + (i + 1) + '</span>' +
        '<span class="btype">' + esc(law.type) + '</span>' +
        '<span class="btxt">《' + esc(short(law.title, 30)) + '》<b>' + esc(c[1]) + '</b></span>' +
        '<span class="bopen">查看条款 ↗</span></a>';
    }).join('') + '</div>';
  }

  /* ======================================================================
     依据（案卷级）：整卷命中的法规清单，不与单条规则绑定
     ====================================================================== */
  var BASIS_OPEN = false;
  function caseLaws() {
    var cnt = {}, order = [];
    ST.rules.forEach(function (r) {
      var seen = {};
      (r.citations || []).forEach(function (c) {
        var id = c && c[0];
        if (!id || seen[id]) return;
        seen[id] = 1;
        if (!(id in cnt)) { cnt[id] = 0; order.push(id); }
        cnt[id]++;
      });
    });
    return order.map(function (id) {
      var law = DATA.LAWS.filter(function (l) { return l.id === id; })[0];
      return law ? { law: law, n: cnt[id] } : null;
    }).filter(Boolean).sort(function (a, b) {
      return b.n - a.n || a.law.title.localeCompare(b.law.title, 'zh');
    });
  }
  function renderBasis() {
    var box = $('#basisBody');
    if (!box) return;
    var list = caseLaws();
    if (!list.length) {
      box.innerHTML = '<div class="basis-empty">本卷暂未命中法规依据</div>';
      if ($('#basisSub')) $('#basisSub').textContent = '';
      return;
    }
    if ($('#basisSub')) $('#basisSub').textContent = '整卷通用 · 共 ' + list.length + ' 部';

    var rows = list.map(function (x) {
      var href = './06-法规详情.html?law=' + encodeURIComponent(x.law.id) +
        '&case=' + encodeURIComponent(CASE.acceptNo);
      return '<a class="basisrow lawlink" href="' + href + '" target="_blank"' +
        ' title="查看《' + esc(x.law.title) + '》全文">' +
        '<span class="btxt">《' + esc(x.law.title) + '》</span>' +
        '<span class="bopen">↗</span></a>';
    }).join('');

    box.innerHTML = '<div class="basislist' + (BASIS_OPEN ? ' grid2' : ' collapsed') + '" id="basisList">' + rows + '</div>' +
      (list.length > 3
        ? '<button class="basis-tg" id="basisTg" type="button">' +
            '<span id="basisTgTx">' + (BASIS_OPEN ? '收起' : '展开全部 ' + list.length + ' 条') + '</span>' +
            '<span class="chev' + (BASIS_OPEN ? ' up' : '') + '">▾</span></button>'
        : '');
  }
  function toggleBasis() {
    BASIS_OPEN = !BASIS_OPEN;
    var card = $('#ruleBasisCard'); if (card) card.classList.toggle('open', BASIS_OPEN);
    var l = $('#basisList');
    if (l) { l.classList.toggle('collapsed', !BASIS_OPEN); l.classList.toggle('grid2', BASIS_OPEN); }
    var tx = $('#basisTgTx');
    if (tx) tx.textContent = BASIS_OPEN ? '收起' : '展开全部 ' + caseLaws().length + ' 条';
    var ch = document.querySelector('#basisTg .chev');
    if (ch) ch.classList.toggle('up', BASIS_OPEN);
  }

  /* 查看更多：本卷命中法规全量清单 → 页内弹层（不跳页） */
  function openLawModal() {
    var list = caseLaws();
    var rows = list.map(function (x, i) {
      var href = './06-法规详情.html?law=' + encodeURIComponent(x.law.id) +
        '&case=' + encodeURIComponent(CASE.acceptNo);
      return '<a class="lawmodal-row" href="' + href + '" target="_blank">' +
        '<span class="lm-n">' + (i + 1) + '</span>' +
        '<div class="lm-bd"><h5>《' + esc(x.law.title) + '》</h5>' +
          '<div class="lm-meta">' +
            '<span>类型 <b>' + esc(x.law.type) + '</b></span>' +
            '<span>文号 <b>' + esc(x.law.code || '—') + '</b></span>' +
            '<span>命中 <b>' + x.n + ' 条规则</b></span>' +
          '</div></div>' +
        '<span class="lm-go">查看条款 ↗</span></a>';
    }).join('');
    APP.openModal({
      title: '本卷命中的法规依据（' + list.length + ' 部）',
      width: 'w720',
      body: '<div class="lawmodal-hint">受案号 <b>' + esc(CASE.acceptNo) + '</b> · ' + esc(CASE.product) +
        '：规则引擎在本卷共命中 ' + list.length + ' 部法规，按命中规则条数排序。点击任一部可打开条款全文（新窗口）。</div>' +
        '<div class="lawmodal-list">' + (rows || '<div class="audit-empty">本卷暂未命中法规</div>') + '</div>',
      foot: '<span class="sp"></span><button class="btn" data-close="1">关闭</button>'
    });
  }

  function evidenceChips(r) {
    return r.evidence.map(function (ev, i) {
      var on = ST.pdf && ST.pdf.sec === ev.sec && ST.pdf.para === ev.para;
      return '<span class="evchip2' + (on ? ' on' : '') + '" data-act="locate" data-ei="' + i + '" title="定位到原文">' +
        ic('book', 12) + '<span class="f">' + esc(ev.sec) + ' · ' + esc(ev.para) + '</span>' +
        '<span class="q">「' + esc(short(ev.quote, 14)) + '」</span></span>';
    }).join('');
  }

  /* AI 结论：支持就地编辑，采纳时写入的是最后编辑的版本 */
  function aiBlock(r) {
    if (ST.editing === r.id) {
      return '<div class="resblock"><span class="lab">AI 结论</span>' +
        '<div class="val ai editing">' +
          '<textarea id="aiEdit" spellcheck="false" placeholder="修改 AI 结论…">' + esc(r.ai) + '</textarea>' +
          '<div class="aiact"><span class="hint">保存后点「采纳」，草稿里写入的就是修改后的结论</span><span class="sp"></span>' +
            '<button class="btn xs" data-act="cancelAI">取消</button>' +
            '<button class="btn xs primary" data-act="saveAI">保存修改</button>' +
          '</div>' +
        '</div></div>';
    }
    return '<div class="resblock"><span class="lab">AI 结论</span>' +
      '<div class="val ai">' +
        '<button class="btn xs ai-edit" data-act="editAI" title="修改 AI 结论后再采纳">编辑</button>' +
        '<div class="ai-text">' + esc(r.ai) + '</div>' +
        (r.edited ? '<div class="ai-edited">已人工修改' + (r.editedAt ? ' · ' + esc(r.editedAt) : '') +
          '　<a data-act="resetAI">还原为 AI 原文</a></div>' : '') +
      '</div></div>';
  }

  function renderResult() {
    var box = $('#resultBody');
    if (!box) return;
    var r = current();
    if (!r) {
      box.innerHTML = '<div class="ph"><div class="phi">' + ic('info', 18) + '</div>' +
        '<div class="pht">请选择一条规则</div><div class="phs">点击左侧「规则列表」中的任意一条，这里显示检查项、AI 结论、依据与复核操作。</div></div>';
      if ($('#resSub')) $('#resSub').textContent = '';
      return;
    }
    if ($('#resSub')) $('#resSub').textContent = '证据 ' + r.evidence.length + ' 条';

    var actions = '';
    if (r.status === '待复核') {
      actions = '<button class="btn xs primary" data-act="adopt" title="采纳后把最终结论写入发补意见草稿">采纳</button>' +
        '<button class="btn xs" data-act="reject" title="不采纳，可填写备注说明理由">不采纳</button>';
    } else if (r.status === '已采纳') {
      actions = '<span class="tag t-green">已采纳 · 已写入草稿</span>' +
        '<button class="btn xs" data-act="undo">撤销采纳</button>';
    } else {
      actions = '<span class="tag t-gray">不采纳</span>' +
        '<button class="btn xs" data-act="undo">恢复待复核</button>';
    }
    var remarkBox =
      '<div class="remark"><div class="rl">' + ic('doc', 12) + ' 复核备注（选填，采纳 / 不采纳均可填写）</div>' +
      '<textarea data-remark="' + esc(r.id) + '" placeholder="记录判断理由、需补充的资料或与企业的沟通情况…">' +
      esc(r.remark || '') + '</textarea></div>';

    box.innerHTML = '<div class="reswrap">' +
      '<div class="reshead"><span class="rid">' + esc(r.id) + '</span><span class="rname">' + esc(r.name) + '</span>' +
        '<span class="ract">' + actions + '</span>' +
        '<div class="tags">' + levelTagFull(r.level) + statusTag(r.status) +
        '<span class="tag t-gray tiny" title="人工采纳率：近 ' + (r.hr ? r.hr.n : 0) + ' 次命中中 ' +
          (r.hr ? r.hr.a : 0) + ' 次被人工采纳">人工采纳率 ' + rateText(r) + '</span>' +
        (r.edited ? '<span class="tag t-blue tiny">人工已修改</span>' : '') +
        (r.by ? '<span class="tag t-gray tiny">复核人 ' + esc(r.by) + ' · ' + esc(r.at) + '</span>'
              : '<span class="tag t-gray tiny">尚未复核</span>') + '</div></div>' +

      '<div class="resblock"><span class="lab">检查项</span><div class="val">' + esc(r.check) + '</div></div>' +
      aiBlock(r) +
      '<div class="resblock"><span class="lab">原文证据</span><div class="val"><div class="evline">' + evidenceChips(r) + '</div></div></div>' +

      remarkBox +

      auditHtml(r) +
    '</div>';
  }

  /* ---------------- 原文 PDF ---------------- */
  function setPdf(ev, rid) {
    ST.pdf = { sec: ev.sec, para: ev.para, quote: ev.quote, page: ev.page, from: rid };
    var idx = -1;
    DATA.READER.forEach(function (s, i) { if (s.sec === ev.sec) idx = i; });
    ST.pdfPage = idx >= 0 ? idx : 0;
  }

  function renderPdf() {
    var box = $('#pdfBody');
    if (!box) return;
    var secs = DATA.READER || [];
    if (!ST.pdf) {
      box.innerHTML = '<div class="pdfempty">' + ic('doc', 22) + '<div style="margin-top:8px">尚未选择规则</div>' +
        '<div style="font-size:11.5px;margin-top:4px">选中规则后，这里显示企业申报材料原文 PDF，并高亮命中段落。</div></div>';
      return;
    }
    var idx = Math.min(Math.max(ST.pdfPage, 0), secs.length - 1);
    var sec = secs[idx];
    if (!sec) { box.innerHTML = '<div class="pdfempty">原文未载入</div>'; return; }

    var hit = ST.pdf.sec === sec.sec;
    var paras = sec.paras.map(function (p) {
      var isT = hit && p.n === ST.pdf.para;
      var txt = esc(p.text);
      if (isT && ST.pdf.quote) {
        var q = esc(ST.pdf.quote);
        if (txt.indexOf(q) >= 0) txt = txt.replace(q, '<mark>' + q + '</mark>');
      }
      return '<div class="pdf-para' + (isT ? ' hl' : '') + '"><span class="pn">' + esc(p.n) + '</span>' + txt + '</div>';
    }).join('');

    var doc = ST.docs.filter(function (d) { return d.ch === sec.sec; })[0];
    var rps = doc ? DATA.dirText(doc.dir) : '';
    var rule = ST.rules.filter(function (r) { return r.id === ST.pdf.from; })[0];

    box.innerHTML = '<div class="pdfwrap">' +
      '<div class="pdftool">' +
        '<span style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--t2)" title="' + esc(sec.sec + '.pdf') + '">' + esc(sec.sec) + '.pdf</span>' +
        '<span class="sp"></span>' +
        '<div class="pg"><button data-act="pgPrev"' + (idx <= 0 ? ' disabled' : '') + '>‹</button>' +
          '<span>第 ' + (idx + 1) + ' / ' + secs.length + ' 页</span>' +
          '<button data-act="pgNext"' + (idx >= secs.length - 1 ? ' disabled' : '') + '>›</button></div>' +
        '<div class="zl"><button data-act="zoomOut">−</button><span>' + Math.round(ST.zoom * 100) + '%</span><button data-act="zoomIn">+</button></div>' +
      '</div>' +
      '<div class="pdfstage"><div class="pdfpage" style="transform:scale(' + ST.zoom + ')">' +
        '<div class="pdfpage-hd"><b>' + esc(CASE.product) + '</b><span>' + esc(sec.sec) + (rps ? ' · ' + esc(rps) : '') + '</span></div>' +
        '<div class="pdfpage-bd">' + paras + '</div>' +
        '<div class="pdfpage-ft">第 ' + (idx + 1) + ' 页 / 共 ' + secs.length + ' 页（演示节选）</div>' +
      '</div></div>' +
      '<div class="pdfbar">定位自 <b>' + esc(ST.pdf.from) + '</b>' + (rule ? ' · ' + esc(rule.name) : '') +
        (hit ? '' : ' · <a data-act="backHit">回到命中段落</a>') +
      '</div>' +
    '</div>';
  }

  /* ---------------- 选择 / 操作 ---------------- */
  function selectRule(id) {
    var r = ST.rules.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    ST.active = r.id;
    if (r.evidence && r.evidence[0]) setPdf(r.evidence[0], r.id);
    renderListItems();
    renderResult();
    renderPdf();
  }

  function locate(ei) {
    var r = current();
    if (!r) return;
    var ev = r.evidence[ei];
    if (!ev) return;
    setPdf(ev, r.id);
    renderResult();
    renderPdf();
  }

  function afterRuleChange() {
    renderStats();
    renderFilter();
    renderListItems();
    renderResult();
  }

  /* ---------------- 人工复核：采纳 / 不采纳（备注可随时填） ---------------- */
  function citeText(r) {
    if (!r.citations || !r.citations.length) return r.basis || '';
    return r.citations.map(function (c) {
      var law = DATA.LAWS.filter(function (l) { return l.id === c[0]; })[0];
      return law ? ('《' + law.title + '》' + c[1]) : (c[0] + ' ' + c[1]);
    }).join('；');
  }
  function pushToDraft(r) {
    var payload = {
      ruleId: r.id, name: r.name, ch: r.ch || '',
      conclusion: r.ai, basis: citeText(r), remark: r.remark || '',
      level: r.level, caseNo: CASE.acceptNo
    };
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ __fb: 'adoptRule', payload: payload }, '*');
    } else {
      try {
        var q = JSON.parse(sessionStorage.getItem('fb_adopt_queue') || '[]');
        q.push(payload); sessionStorage.setItem('fb_adopt_queue', JSON.stringify(q));
      } catch (e) {}
    }
  }
  function adopt() {
    var r = current(); if (!r) return;
    if (ST.editing === r.id) { APP.toast('AI 结论正在编辑中，请先点「保存修改」再采纳', 'warn', 2600); return; }
    if (r.status === '已采纳') { APP.toast('该结论已采纳并写入草稿，无需重复操作', 'warn', 2200); return; }
    r.status = '已采纳'; r.by = ME; r.at = nowStr(); r.pushed = true;
    logRule(r, '采纳结论', r.edited ? '采纳人工修改后的版本，已写入草稿' : '采纳 AI 原始结论，已写入草稿');
    pushToDraft(r);
    afterRuleChange();
    APP.toast('已采纳：' + r.name + (r.edited ? '（按人工修改后的结论）' : '') +
      '，已写入发补意见草稿', 'ok', 3200);
  }
  function reject() {
    var r = current(); if (!r) return;
    var prev = r.status, prevBy = r.by, prevAt = r.at;
    r.status = '不采纳'; r.by = ME; r.at = nowStr();
    logRule(r, '标记不采纳', r.remark ? ('备注：' + short(r.remark, 40)) : '未填写备注', 'warn');
    afterRuleChange();
    APP.toastUndo('已标记不采纳：' + r.name + (r.remark ? '（备注已保留）' : ''), function () {
      r.status = prev; r.by = prevBy; r.at = prevAt;
      if (r.log && r.log[0] && r.log[0].act === '标记不采纳') r.log.shift();
      afterRuleChange();
    }, 8000);
  }
  function undo() {
    var r = current(); if (!r) return;
    logRule(r, '撤销复核结论', '恢复为待复核', 'warn');
    r.status = '待复核'; r.by = ''; r.at = '';
    afterRuleChange();
    APP.toast('已恢复为待复核；草稿中已生成的内容不会被自动删除，可在草稿页手工调整', 'warn', 3200);
  }

  /* ======================================================================
     文件归属调整（抽屉）
     ====================================================================== */
  function groupDocs() {
    var g = {};
    DATA.RPS_DIRS.forEach(function (d) { g[d.k] = []; });
    ST.docs.forEach(function (d) { if (g[d.dir]) g[d.dir].push(d); });
    return g;
  }
  function dirState(k, g) {
    if (ST.na[k]) return 'na';
    var arr = g[k] || [];
    if (!arr.length) return 'miss';
    if (arr.some(function (d) { return d.state === 'low'; })) return 'warn';
    return 'ok';
  }

  function openMap() {
    APP.openModal({
      title: '文件归属调整（rps 目录 ↔ ch 文件）', width: 'w1100',
      body: '<div class="mapbar" id="mapBar"></div>' +
        '<div class="mapdlg"><div class="mapdlg-l" id="mapDirs"></div>' +
        '<div class="mapdlg-r"><div class="mapdlg-h" id="mapHead"></div><div class="mapdlg-b" id="mapBody"></div></div></div>',
      foot: '<span class="tip">调整立即生效；文件归属会同步影响原文 PDF 的目录标注</span><span class="sp"></span>' +
        '<button class="btn primary" data-close="1">完成</button>',
      after: function (m) {
        ST.modal = m;
        renderMap();
      }
    });
  }

  function renderMap() {
    if (!ST.modal || !document.body.contains(ST.modal)) return;
    var g = groupDocs();
    var total = ST.docs.length;
    var low = ST.docs.filter(function (d) { return d.state === 'low'; }).length;
    var withFiles = 0, missing = 0;
    DATA.RPS_DIRS.forEach(function (d) {
      var n = (g[d.k] || []).length;
      if (n) withFiles++; else if (!ST.na[d.k]) missing++;
    });

    $('#mapBar').innerHTML =
      '<span>共 <b>' + total + '</b> 个 ch 文件</span><span>已对应目录 <b>' + withFiles + '</b> / ' + DATA.RPS_DIRS.length + '</span>' +
      '<span>待确认 <b>' + low + '</b></span><span>缺项 <b>' + missing + '</b></span>';

    $('#mapDirs').innerHTML = DATA.RPS_DIRS.map(function (d) {
      var st = dirState(d.k, g);
      var n = (g[d.k] || []).length;
      return '<div class="diritem ' + st + (ST.mapDir === d.k ? ' on' : '') + '" data-dir="' + d.k + '" title="' + esc(d.t) + '">' +
        '<span class="rd"></span><span class="dn">' + esc(d.t) + '</span>' +
        '<span class="dc">' + (st === 'na' ? '不适用' : n) + '</span></div>';
    }).join('');

    var dir = DATA.RPS_DIRS.filter(function (d) { return d.k === ST.mapDir; })[0] || DATA.RPS_DIRS[0];
    var arr = (g[dir.k] || []).slice();
    if (ST.mapKw.trim()) {
      var kw = ST.mapKw.trim().toLowerCase();
      arr = arr.filter(function (d) { return d.name.toLowerCase().indexOf(kw) >= 0; });
    }
    var lowN = (g[dir.k] || []).filter(function (d) { return d.state === 'low'; }).length;

    $('#mapHead').innerHTML = '<span class="mn">' + esc(dir.t) + '</span>' +
      '<span class="sub" style="font-size:11.5px;color:var(--t4)">' +
        (ST.na[dir.k] ? '已标记不适用' : (g[dir.k] || []).length + ' 个文件' + (lowN ? ' · ' + lowN + ' 待确认' : '')) + '</span>' +
      '<div class="right"><input class="mapsearch" id="mapKw" placeholder="搜索文件名" value="' + esc(ST.mapKw) + '">' +
        (ST.na[dir.k] ? '<button class="btn xs" data-act="unna">撤销不适用</button>'
          : (!(g[dir.k] || []).length ? '<button class="btn xs" data-act="na">标记不适用</button>' : '')) +
      '</div>';

    if (ST.na[dir.k]) {
      $('#mapBody').innerHTML = '<div class="ph"><div class="phi">' + ic('info', 18) + '</div>' +
        '<div class="pht">该目录已标记为「不适用」</div><div class="phs">本次申报资料无需提交该目录，一致性检查会跳过它。</div></div>';
      return;
    }
    if (!(g[dir.k] || []).length) {
      $('#mapBody').innerHTML = '<div class="ph"><div class="phi">' + ic('warn', 18) + '</div>' +
        '<div class="pht">该 rps 目录下没有 ch 文件</div>' +
        '<div class="phs">可能是企业漏交，或本申报类型确实不需要。<br>可在右侧其它目录找到文件后调整归档目录，或标记为不适用。</div>' +
        '<div style="margin-top:12px"><button class="btn sm" data-act="na">标记为不适用</button></div></div>';
      return;
    }
    if (!arr.length) {
      $('#mapBody').innerHTML = '<div class="empty" style="padding:30px"><div class="et">没有匹配的文件</div>' +
        '<div class="es">换个关键词试试</div></div>';
      return;
    }

    var h = '<table class="dtbl"><thead><tr><th style="width:24px">#</th><th>ch 文件</th><th style="width:44px">页数</th>' +
      '<th style="width:130px">识别章节</th><th style="width:76px">状态</th><th style="width:190px">归档到</th></tr></thead><tbody>';
    arr.forEach(function (d, i) {
      var stTag = d.state === 'low' ? '<span class="tag t-amber tiny">待确认</span>'
        : (d.mode === 'manual' ? '<span class="tag t-blue tiny">人工指定</span>' : '<span class="tag t-green tiny">已对应</span>');
      h += '<tr class="' + (d.state === 'low' ? 'low' : '') + '">' +
        '<td style="color:var(--t4)">' + (i + 1) + '</td>' +
        '<td class="fn">' + esc(d.name) + '</td>' +
        '<td style="font-family:var(--mono);color:var(--t3)">' + d.page + '</td>' +
        '<td style="font-size:11.5px;color:var(--t3)">' + esc(d.ch) + '</td>' +
        '<td>' + stTag + '</td>' +
        '<td><select class="sel dirsel2" data-doc="' + esc(d.id) + '">' +
          DATA.RPS_DIRS.map(function (x) {
            return '<option value="' + x.k + '"' + (x.k === d.dir ? ' selected' : '') + '>' + esc(x.t) + '</option>';
          }).join('') +
        '</select></td></tr>';
    });
    h += '</tbody></table>';
    $('#mapBody').innerHTML = h;
  }

  /* ---------------- 弹窗模块 ---------------- */
  /* 一键弹出：始终在「本页」把模块搬进浮窗（即使本页被「发补智能体」以 iframe 嵌入）。
     原因：跨 iframe 再开一份实例会各自持有一份状态，点规则列表时其他模块不联动。 */
  var POPPED = [];
  /* 模块被搬进浮窗后，剩下的列自动铺满：宽度按「原比例」重算，不留空槽 */
  function syncPopLayout() {
    var w = document.querySelector('.rulewrap');
    APP.popFill(w, [
      { key: 'rules', el: $('#ruleListCard') },
      { key: 'result', el: document.querySelector('#rcol'), flex: true, stay: true },
      { key: 'pdf', el: $('#rulePdfCard') }
    ], POPPED);
    var rc = document.querySelector('#rcol');
    if (rc) rc.classList.toggle('solo', POPPED.indexOf('result') >= 0);
    document.body.classList.toggle('has-float', POPPED.length > 0);
  }
  function popModule(kind) {
    var map = {
      rules: { el: $('#ruleListCard'), t: '规则列表' },
      result: { el: $('#ruleResultCard'), t: '规则结果' },
      pdf: { el: $('#rulePdfCard'), t: '企业申报材料 · 原文 PDF' }
    };
    var c = map[kind];
    if (!c || !c.el) return;
    if (POPPED.indexOf(kind) >= 0) {
      APP.toast('「' + c.t + '」已在浮窗中，可直接拖动或点分屏', 'info', 2200);
      return;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var top = 62, h = Math.max(300, vh - top - 12);
    var idx = POPPED.length;
    var w = Math.round(vw * (idx < 2 ? 0.5 : 0.62)) - 12;
    var left = idx === 0 ? 8 : (idx === 1 ? Math.round(vw / 2 + 4) : Math.round((vw - w) / 2));
    POPPED.push(kind);
    syncPopLayout();
    APP.openFloat({
      el: c.el, title: c.t, sub: CASE.acceptNo + ' · ' + CASE.product,
      width: w, height: h, left: left, top: top,
      onClose: function () {
        POPPED = POPPED.filter(function (k) { return k !== kind; });
        syncPopLayout();
      }
    });
    APP.toast('已弹出「' + c.t + '」：点规则会同步刷新规则结果与原文', 'ok', 2600);
  }

  function buildEmbed(kind) {
    document.body.classList.add('embed-mode');
    var noHead = qs.get('float') === '1';
    if (noHead) document.body.classList.add('float-mode');
    var shell = document.querySelector('.shell');
    if (shell) shell.parentNode.removeChild(shell);   /* 避免与主页面同 id 的容器抢渲染 */
    var titles = { rules: '规则列表', result: '规则结果', pdf: '企业申报材料 · 原文 PDF' };
    var root = document.createElement('div');
    root.className = 'embed-root';
    root.innerHTML =
      (noHead ? '' : '<div class="embed-hd"><b>' + esc(titles[kind] || '') + '</b>' +
        '<span class="sub">' + esc(CASE.acceptNo) + ' · ' + esc(CASE.product) + '</span>' +
        '<span class="sp"></span><button class="btn xs" data-act="closeWin">关闭窗口</button></div>') +
      '<div class="embed-bd" id="embedBd"></div>';
    document.body.appendChild(root);
    var bd = $('#embedBd');
    if (kind === 'rules') {
      bd.innerHTML = '<div class="rfilter" id="rfilter"></div><div class="rlist" id="rlist"></div>';
      renderFilter();
      renderListItems();
    } else if (kind === 'result') {
      bd.innerHTML = '<div id="resultBody" style="flex:1;overflow:auto;padding:14px"></div>';
      renderResult();
    } else if (kind === 'pdf') {
      bd.innerHTML = '<div id="pdfBody" style="flex:1;min-height:0"></div>';
      renderPdf();
    }
  }

  /* ---------------- 导出 / 其它 ---------------- */
  function exportCsv() {
    var rows = [['规则编号', '规则名称', '风险等级', '检查项', 'AI结论', '依据', '复核状态', '复核备注', '复核人', '复核时间']];
    ST.rules.forEach(function (r) {
      rows.push([r.id, r.name, r.level, r.check, r.ai, r.basis, r.status, r.remark || '', r.by || '', r.at || '']);
    });
    var csv = rows.map(function (row) {
      return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '规则复核台账_' + CASE.acceptNo + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 100);
    APP.toast('已导出规则复核台账 CSV', 'ok', 2200);
  }

  $('#btnDraft').onclick = function () {
    var n = stat().adopted;
    if (!n) { APP.toast('请先采纳至少 1 条规则结论，再生成发补意见草稿', 'warn', 2600); return; }
    APP.confirmDialog({
      title: '生成发补意见草稿', tone: 'amber', okText: '确认生成',
      body: '将把规则校验中<b>已采纳的 ' + n + ' 条结论</b>写入受理号 <b>' + esc(CASE.acceptNo) + '</b> 的发补意见草稿。<br>' +
        '不采纳、通过与待复核的规则不会写入。'
    }, function () {
      /* 在「发补智能体」Tab 内：直接切到草稿 Tab；独立打开时：进发补智能体页的草稿 Tab */
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ __fb: 'goto', tab: 'draft' }, '*');
      } else {
        location.href = './08-发补智能体.html?case=' + encodeURIComponent(CASE.acceptNo) + '&tab=draft';
      }
    });
  };
  $('#btnMap').onclick = openMap;

  /* ---------------- 事件 ---------------- */
  document.addEventListener('input', function (e) {
    var ta = e.target.closest('[data-remark]');
    if (!ta) return;
    var r = ST.rules.filter(function (x) { return x.id === ta.dataset.remark; })[0];
    if (r) r.remark = ta.value;
  });

  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-remark')) t.dataset.prev = t.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.hasAttribute || !t.hasAttribute('data-remark')) return;
    var rr = ST.rules.filter(function (x) { return x.id === t.dataset.remark; })[0];
    if (!rr) return;
    var prev = t.dataset.prev || '', now = t.value;
    if (prev === now) return;
    logRule(rr, prev ? '改写复核备注' : '填写复核备注',
      prev ? ('改写为 ' + now.length + ' 字') : ('写为 ' + now.length + ' 字'));
    rr.remark = now;
    t.dataset.prev = now;
    renderResult();
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('#basisTg')) { toggleBasis(); return; }
    if (e.target.closest('#basisMore')) { openLawModal(); return; }
    if (e.target.closest('#popBack')) { APP.closeAllFloats(); return; }
    var pop = e.target.closest('[data-pop]');
    if (pop) { popModule(pop.dataset.pop); return; }

    var b = e.target.closest('[data-bar]');
    if (b) {
      var act = b.dataset.bar;
      if (act === 'export') { exportCsv(); return; }
      if (act === 'rerun') { runEngine(false); return; }
    }

    var f = e.target.closest('[data-f]');
    if (f) {
      ST.status = f.dataset.f;
      $$('.rfchip').forEach(function (el) { el.classList.toggle('on', el.dataset.f === ST.status); });
      renderListItems();
      return;
    }

    var a = e.target.closest('[data-act]');
    if (!a) return;
    var act2 = a.dataset.act;
    if (act2 === 'select') { selectRule(a.dataset.id); return; }
    if (act2 === 'locate') { locate(parseInt(a.dataset.ei || '0', 10)); return; }
    if (act2 === 'editAI') {
      ST.editing = ST.active; renderResult();
      var ta0 = $('#aiEdit');
      if (ta0) { ta0.focus(); try { ta0.setSelectionRange(ta0.value.length, ta0.value.length); } catch (e2) {} }
      return;
    }
    if (act2 === 'saveAI') {
      var ta = $('#aiEdit'), r0 = current();
      if (!ta || !r0) return;
      var v = ta.value.replace(/\s+$/, '');
      if (!v.trim()) { APP.toast('AI 结论不能为空，请填写后再保存', 'warn', 2400); ta.focus(); return; }
      if (!r0.aiOriginal) r0.aiOriginal = r0.ai;
      logRule(r0, '修改 AI 结论', '改为「' + short(v, 28) + '」');
      r0.ai = v; r0.edited = true; r0.editedAt = nowStr();
      ST.editing = null;
      renderResult(); renderListItems();
      APP.toast('AI 结论已修改，点「采纳」后按修改后的内容写入草稿', 'ok', 3000);
      return;
    }
    if (act2 === 'cancelAI') { ST.editing = null; renderResult(); return; }
    if (act2 === 'resetAI') {
      var r1 = current(); if (!r1 || !r1.aiOriginal) return;
      logRule(r1, '还原 AI 原文', '撤销人工修改，恢复为规则引擎输出', 'warn');
      r1.ai = r1.aiOriginal; r1.edited = false; delete r1.aiOriginal; delete r1.editedAt;
      renderResult(); renderListItems();
      APP.toast('已还原为 AI 原始结论', 'ok', 2200);
      return;
    }
    if (act2 === 'adopt') { adopt(); return; }
    if (act2 === 'reject') { reject(); return; }
    if (act2 === 'undo') { undo(); return; }
    if (act2 === 'pgPrev') { ST.pdfPage = Math.max(0, ST.pdfPage - 1); renderPdf(); return; }
    if (act2 === 'pgNext') { ST.pdfPage = Math.min(DATA.READER.length - 1, ST.pdfPage + 1); renderPdf(); return; }
    if (act2 === 'zoomOut') { ST.zoom = Math.max(0.8, Math.round((ST.zoom - 0.1) * 10) / 10); renderPdf(); return; }
    if (act2 === 'zoomIn') { ST.zoom = Math.min(1.4, Math.round((ST.zoom + 0.1) * 10) / 10); renderPdf(); return; }
    if (act2 === 'backHit') {
      if (ST.pdf) {
        var idx = 0;
        DATA.READER.forEach(function (s, i) { if (s.sec === ST.pdf.sec) idx = i; });
        ST.pdfPage = idx; renderPdf();
      }
      return;
    }
    if (act2 === 'closeWin') { window.close(); return; }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'rKw') { ST.kw = e.target.value; renderListItems(); }
    if (e.target.id === 'mapKw') {
      ST.mapKw = e.target.value;
      var pos = e.target.selectionStart;
      renderMap();
      var inp = document.getElementById('mapKw');
      if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {} }
    }
  });

  document.addEventListener('change', function (e) {
    var sel = e.target.closest('select[data-doc]');
    if (!sel) return;
    var d = ST.docs.filter(function (x) { return x.id === sel.dataset.doc; })[0];
    if (!d) return;
    d.dir = sel.value;
    d.mode = 'manual';
    d.state = 'ok';
    renderMap();
    APP.toast('已调整归档目录：' + DATA.dirText(sel.value), 'ok', 2200);
  });

  /* 抽屉内的目录点击 / 不适用 */
  document.addEventListener('click', function (e) {
    var d = e.target.closest('#mapDirs [data-dir], .mapdlg-l [data-dir]');
    if (d) { ST.mapDir = d.dataset.dir; ST.mapKw = ''; renderMap(); return; }
    var na = e.target.closest('[data-act="na"]');
    if (na) { ST.na[ST.mapDir] = true; renderMap(); APP.toast('已标记为不适用', 'ok', 1800); return; }
    var un = e.target.closest('[data-act="unna"]');
    if (un) { delete ST.na[ST.mapDir]; renderMap(); return; }
  }, true);

  /* ---------------- 启动 ---------------- */
  var initialRid = qs.get('rid');
  var first = (initialRid && ST.rules.filter(function (r) { return r.id === initialRid; })[0]) ||
    ST.rules.filter(function (r) { return r.status === '待复核'; })[0] || ST.rules[0];
  if (first) {
    ST.active = first.id;
    if (first.evidence && first.evidence[0]) setPdf(first.evidence[0], first.id);
  }

  /* 被「发补智能体」页以 Tab iframe 嵌入时，隐藏自己的顶栏侧栏 */
  if (qs.get('tab') === '1') document.body.classList.add('tab-mode');

  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.__fb === 'selectRule' && d.rid) {
      var r = ST.rules.filter(function (x) { return x.id === d.rid; })[0];
      if (r) {
        ST.active = r.id;
        if (r.evidence && r.evidence[0]) setPdf(r.evidence[0], r.id);
        renderListItems(); renderResult(); renderPdf();
      }
    }
  });

  var embed = qs.get('embed');
  if (embed) {
    var eiInit = parseInt(qs.get('ei') || '0', 10);
    if (first && first.evidence && first.evidence[eiInit]) setPdf(first.evidence[eiInit], first.id);
    buildEmbed(embed);
  } else {
    seedLogs();
    renderStats();
    mountList();
    renderResult();
    renderBasis();
    renderPdf();
    runEngine(true);
  }

  window.__RULES = { ST: ST, stat: stat, selectRule: selectRule, locate: locate, renderPdf: renderPdf };
})();
</script>
</body>
</html>
